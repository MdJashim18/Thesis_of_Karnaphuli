valude : 
from(bucket: "tunnel_telemetry")
  |> range(start: -10m)
  |> filter(fn: (r) => r._measurement == "tunnel_telemetry")
  |> filter(fn: (r) =>
    r._field == "temperature" or
    r._field == "humidity" or
    r._field == "accel_x" or
    r._field == "accel_y" or
    r._field == "accel_z" or
    r._field == "water_raw" or
    r._field == "load_kg"
  )
  |> pivot(
    rowKey: ["_time"],
    columnKey: ["_field"],
    valueColumn: "_value"
  )
  |> keep(columns: [
    "_time",
    "temperature",
    "humidity",
    "accel_x",
    "accel_y",
    "accel_z",
    "water_raw",
    "load_kg",
    "device_id",
    "zone_id",
    "quality_flag"
  ])
  |> sort(columns: ["_time"])


